# Deploy the static site to GitHub Pages using the official Pages actions.
#
# Requirements for this workflow to succeed:
#   1. The repository must be PUBLIC (GitHub Pages is not available for
#      private repositories on the Free plan), or the account must be on
#      a paid plan that allows Pages from private repos.
#   2. Settings > Pages > Build and deployment > Source must be set to
#      "GitHub Actions". (configure-pages below will attempt to enable
#      this automatically via `enablement: true`.)
#
# The site is plain HTML/CSS/JS served from the repo root, so there is
# no build step: we upload the checkout directly as the Pages artifact.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# These permissions are required by actions/deploy-pages. Without them
# the deploy job fails with "Resource not accessible by integration".
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; do not cancel a production deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
